<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Molly — Ink Art</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#0a0806;
      --paper:#f5f0e8;
      --muted:#6b5f52;
    }
    html{scroll-behavior:smooth}
    body{
      background:var(--paper);
      color:var(--ink);
      font-family:'Cormorant Garamond',serif;
      overflow-x:hidden;
      cursor:none;
    }

    /* paper texture */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events:none;z-index:0;opacity:0.5;
    }
    /* ruled lines */
    body::after{
      content:'';position:fixed;inset:0;
      background-image:repeating-linear-gradient(transparent 0px,transparent 27px,rgba(10,8,6,0.032) 28px);
      pointer-events:none;z-index:0;
    }

    /* ── DEV BANNER ── */
    #dev-banner{
      position:fixed;top:0;left:0;right:0;
      z-index:6000;
      height:30px;
      background:var(--ink);
      color:var(--paper);
      font-family:'Cormorant Garamond',serif;
      font-size:0.68rem;
      letter-spacing:0.2em;
      text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:0.7rem;
      opacity:1;
      transform:translateY(0);
      transition:opacity 0.28s ease,transform 0.28s ease;
    }
    #dev-banner.show{opacity:1;transform:translateY(0)}
    #dev-banner a{
      color:rgba(245,240,232,0.75);
      text-decoration:none;
      transition:color 0.15s;
    }
    #dev-banner a:hover{color:var(--paper)}
    #dev-banner .dot{opacity:0.3;font-size:0.5rem}
    #banner-close{
      position:absolute;right:0.8rem;top:50%;transform:translateY(-50%);
      background:none;border:none;color:rgba(245,240,232,0.4);
      font-size:0.85rem;cursor:none;
      transition:color 0.15s;line-height:1;padding:4px;
    }
    #banner-close:hover{color:var(--paper)}
    body{padding-top:30px}
    body.banner-gone{padding-top:0}

    /* ── LOADER ── */
    #loader{
      position:fixed;inset:0;
      background:var(--ink);
      z-index:9999;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;
      transition:opacity 0.7s ease,transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    #loader.out{opacity:0;pointer-events:none;transform:translateY(-6px)}

    .ld-title{
      font-family:'IM Fell English',serif;
      font-size:clamp(2.2rem,7vw,4.5rem);
      color:var(--paper);font-weight:400;letter-spacing:-0.02em;
      opacity:0;transform:translateY(14px);
      animation:ldUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
    }
    .ld-title em{font-style:italic;opacity:0.5}

    /* animated nib + drip */
    .ld-nib{
      opacity:0;animation:ldUp 0.6s ease 0.45s forwards;
    }
    .ld-nib svg{overflow:visible}

    .ld-bar-wrap{
      width:110px;height:1px;background:rgba(245,240,232,0.12);
      position:relative;overflow:hidden;
      opacity:0;animation:ldUp 0.4s ease 0.65s forwards;
    }
    .ld-bar{
      position:absolute;top:0;left:0;height:100%;width:0;
      background:var(--paper);transition:width 0.08s linear;
    }
    .ld-label{
      font-size:0.62rem;letter-spacing:0.38em;text-transform:uppercase;
      color:rgba(245,240,232,0.3);
      opacity:0;animation:ldUp 0.4s ease 0.75s forwards;
    }
    @keyframes ldUp{to{opacity:1;transform:translateY(0)}}

    /* ── CURSOR — simple, no lag ── */
    #cur{
      position:fixed;pointer-events:none;z-index:8000;
      top:0;left:0;
      /* hotspot at tip = bottom of nib */
    }
    /* CSS drip animation when hovering a post */
    #cur.over-post #cur-drop{
      animation:dripDown 0.7s cubic-bezier(0.4,0,0.6,1) infinite;
    }
    @keyframes dripDown{
      0%  {r:0;cy:50;opacity:0}
      25% {r:3.5;cy:50;opacity:1}
      80% {r:3;cy:68;opacity:0.6}
      100%{r:0;cy:80;opacity:0}
    }

    /* splat on click */
    .splat{
      position:fixed;pointer-events:none;z-index:7990;
      transform:translate(-50%,-50%);
      animation:splatOut 0.75s ease forwards;
    }
    @keyframes splatOut{
      0%{opacity:0;transform:translate(-50%,-50%) scale(0)}
      20%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
    }

    /* ── CORNER MARKS ── */
    .cm{position:fixed;width:18px;height:18px;pointer-events:none;z-index:10;opacity:0.13}
    .cm.tl{top:1.4rem;left:1.4rem;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
    .cm.tr{top:1.4rem;right:1.4rem;border-top:1px solid var(--ink);border-right:1px solid var(--ink)}
    .cm.bl{bottom:1.4rem;left:1.4rem;border-bottom:1px solid var(--ink);border-left:1px solid var(--ink)}
    .cm.br{bottom:1.4rem;right:1.4rem;border-bottom:1px solid var(--ink);border-right:1px solid var(--ink)}

    /* ── HERO ── */
    .hero{
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      position:relative;overflow:hidden;padding:2rem;z-index:1;
    }
    .hero-bg{
      position:absolute;
      font-family:'IM Fell English',serif;
      font-size:clamp(8rem,20vw,18rem);
      color:transparent;
      -webkit-text-stroke:1px rgba(10,8,6,0.05);
      letter-spacing:-0.05em;user-select:none;white-space:nowrap;
      top:50%;left:50%;transform:translate(-50%,-50%);
      pointer-events:none;
      animation:bgDrift 20s ease-in-out infinite alternate;
    }
    @keyframes bgDrift{
      from{transform:translate(-50%,-50%) scale(1)}
      to{transform:translate(-52%,-48%) scale(1.03)}
    }
    /* ambient blobs */
    .blob{
      position:absolute;border-radius:50%;pointer-events:none;
      filter:blur(55px);opacity:0.035;
      animation:blobMove var(--d,18s) ease-in-out infinite alternate;
    }
    @keyframes blobMove{
      from{transform:translate(0,0)}
      to{transform:translate(var(--tx,20px),var(--ty,-20px))}
    }

    .ink-line{width:1px;height:0;background:var(--ink);margin:0 auto 3rem;animation:lineGrow 1.4s cubic-bezier(0.16,1,0.3,1) 0.35s forwards}
    @keyframes lineGrow{to{height:80px}}

    .hero-title{
      font-family:'IM Fell English',serif;
      font-size:clamp(3.5rem,10vw,8rem);
      font-weight:400;letter-spacing:-0.02em;line-height:0.9;text-align:center;
      opacity:0;transform:translateY(28px);
      animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.65s forwards;
    }
    .hero-title em{font-style:italic;color:var(--muted)}
    .hero-sub{
      font-size:clamp(0.82rem,2vw,1.05rem);letter-spacing:0.35em;
      text-transform:uppercase;color:var(--muted);margin-top:1.5rem;
      opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.95s forwards;
    }
    .scroll-hint{
      position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:0.5rem;
      opacity:0;animation:fadeUp 1s ease 1.45s forwards;
      color:var(--muted);font-size:0.68rem;letter-spacing:0.3em;text-transform:uppercase;
    }
    .scroll-hint span{width:1px;height:38px;background:var(--muted);animation:scPulse 2s ease-in-out infinite}
    @keyframes scPulse{0%,100%{opacity:0.3}50%{opacity:1}}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

    /* ── GALLERY ── */
    .gallery-section{padding:4rem 2rem 6rem;max-width:1400px;margin:0 auto;position:relative;z-index:1}
    .sec-label{
      display:flex;align-items:center;gap:1.5rem;margin-bottom:4rem;
      opacity:0;transform:translateY(18px);
      transition:opacity 0.8s ease,transform 0.8s ease;
    }
    .sec-label.visible{opacity:1;transform:translateY(0)}
    .sec-label::before,.sec-label::after{content:'';flex:1;height:1px;background:var(--ink);opacity:0.18}
    .sec-label span{font-size:0.68rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

    .ig-grid{columns:1;column-gap:2rem}
    @media(min-width:640px){.ig-grid{columns:2}}
    @media(min-width:1024px){.ig-grid{columns:3}}

    /* ── POST ── */
    .ig-item{
      break-inside:avoid;margin-bottom:2.5rem;
      opacity:0;transform:translateY(46px) rotate(0.25deg);
      transition:opacity 0.65s ease,transform 0.65s cubic-bezier(0.16,1,0.3,1);
      position:relative;
    }
    .ig-item.visible{opacity:1;transform:translateY(0) rotate(0deg)}

    .pw{
      position:relative;
      transition:transform 0.38s cubic-bezier(0.16,1,0.3,1),box-shadow 0.38s ease;
    }
    .pw:hover{
      transform:translateY(-5px) rotate(-0.35deg) scale(1.008);
      box-shadow:5px 10px 28px rgba(10,8,6,0.11);
    }
    /* tape piece */
    .pw::before{
      content:'';position:absolute;
      top:-7px;left:50%;
      transform:translateX(-50%) rotate(-1.2deg) scaleY(0);
      width:42px;height:13px;
      background:rgba(10,8,6,0.1);border-radius:1px;
      z-index:3;pointer-events:none;
      transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
      transform-origin:bottom center;
    }
    .pw:hover::before{transform:translateX(-50%) rotate(-1.2deg) scaleY(1)}

    /* number badge */
    .pnum{
      position:absolute;top:-11px;right:-9px;
      width:24px;height:24px;
      background:var(--ink);color:var(--paper);
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'IM Fell English',serif;font-size:0.6rem;font-style:italic;
      z-index:10;pointer-events:none;
      opacity:0;transform:scale(0.5) rotate(-12deg);
      transition:opacity 0.22s ease,transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pw:hover .pnum{opacity:1;transform:scale(1) rotate(0)}

    /* ripple */
    .ripple{
      position:absolute;border-radius:50%;
      background:rgba(10,8,6,0.06);
      pointer-events:none;transform:scale(0);
      animation:rip 0.6s ease-out forwards;z-index:20;
    }
    @keyframes rip{to{transform:scale(5);opacity:0}}
    .pw.clicked{animation:bounce 0.42s cubic-bezier(0.34,1.56,0.64,1) forwards}
    @keyframes bounce{
      0%{transform:scale(1)}
      30%{transform:scale(0.97) rotate(0.4deg)}
      65%{transform:scale(1.025) rotate(-0.25deg)}
      100%{transform:scale(1) rotate(0)}
    }

    .ig-item blockquote{border-radius:2px!important;box-shadow:0 2px 18px rgba(10,8,6,0.05)!important}

    /* ── FOOTER ── */
    footer{border-top:1px solid rgba(10,8,6,0.08);padding:3rem 2rem;text-align:center;position:relative;z-index:1}
    .fn{font-family:'IM Fell English',serif;font-size:1.75rem;font-style:italic;color:var(--muted);margin-bottom:0.5rem}
    .fig{
      font-size:0.72rem;letter-spacing:0.3em;text-transform:uppercase;
      color:var(--muted);opacity:0.55;text-decoration:none;
      transition:opacity 0.18s,letter-spacing 0.28s;
    }
    .fig:hover{opacity:1;letter-spacing:0.44em}
  </style>
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="ld-title">Molly's <em>Art</em></div>
    <div class="ld-nib">
      <svg width="36" height="82" viewBox="0 0 36 82" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
        <path d="M18 3 L30 24 L18 52 L6 24 Z" fill="#f5f0e8" opacity="0.82"/>
        <path d="M18 52 L15 43 L18 47 L21 43 Z" fill="#f5f0e8"/>
        <line x1="18" y1="3" x2="18" y2="0" stroke="#f5f0e8" stroke-width="1.5" opacity="0.35"/>
        <!-- drip animates down -->
        <circle cx="18" cy="52" r="0" fill="#f5f0e8">
          <animate attributeName="r"   values="0;3.5;3.5;0"      keyTimes="0;0.25;0.78;1" dur="1.4s" repeatCount="indefinite" begin="0.4s"/>
          <animate attributeName="cy"  values="52;52;72;86"       keyTimes="0;0.25;0.78;1" dur="1.4s" repeatCount="indefinite" begin="0.4s"/>
          <animate attributeName="opacity" values="0;0.9;0.6;0"  keyTimes="0;0.25;0.78;1" dur="1.4s" repeatCount="indefinite" begin="0.4s"/>

  <!-- DEV BANNER -->

  </div>

  <!-- CURSOR SVG — instant, no smoothing, no canvas -->
  <svg id="cur" width="22" height="52" viewBox="0 0 22 52" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;transition:none">
    <!-- pen barrel -->
    <rect x="8.5" y="0" width="5" height="14" rx="1.2" fill="#0a0806"/>
    <!-- nib -->
    <path d="M11 12 L17 26 L11 42 L5 26 Z" fill="#0a0806"/>
    <!-- nib slit -->
    <line x1="11" y1="26" x2="11" y2="42" stroke="#f5f0e8" stroke-width="0.7" opacity="0.45"/>
    <!-- tip dot -->
    <circle cx="11" cy="42" r="1.2" fill="#0a0806"/>
    <!-- ink drop — animated by JS class -->
    <circle id="cur-drop" cx="11" cy="50" r="0" fill="#0a0806"/>
  </svg>

  <div class="cm tl"></div><div class="cm tr"></div>
  <div class="cm bl"></div><div class="cm br"></div>

  <!-- HERO -->
  <section class="hero">

  <!-- GALLERY -->

    <div class="sec-label"><span>Latest Works</span></div>

  <footer>
    <div class="fn">Molly</div>
    <a class="fig" href="https://www.instagram.com/molly_ina_trolly/" target="_blank">@molly_ina_trolly ↗</a>
  </footer>

<script>
/* ── LOADER ── */
const loader = document.getElementById('loader');
const ldBar  = document.getElementById('ld-bar');
let prog = 0;
const progInt = setInterval(() => {
  prog += Math.random() * 13;
  if (prog > 91) prog = 91;
  ldBar.style.width = prog + '%';
}, 110);

function hideLoader() {
  clearInterval(progInt);
  ldBar.style.transition = 'width 0.28s ease';
  ldBar.style.width = '100%';
  setTimeout(() => {
    loader.classList.add('out');
    /* banner already visible */
    setTimeout(() => loader.remove(), 800);
  }, 320);
}

let fontsOk = false, timeOk = false;
function tryHide() { if (fontsOk && timeOk) hideLoader(); }
document.fonts.ready.then(() => { fontsOk = true; tryHide(); });
setTimeout(() => { timeOk = true; tryHide(); }, 1700);

document.getElementById('banner-close').addEventListener('click', () => {
  const b = document.getElementById('dev-banner');
  b.style.transition = 'opacity 0.28s,transform 0.28s';
  b.style.opacity = '0'; b.style.transform = 'translateY(-100%)';
  document.body.classList.add('banner-gone');
  setTimeout(() => b.remove(), 300);
});

/* ── CURSOR — direct, no smoothing ── */
const cur     = document.getElementById('cur');
const curDrop = document.getElementById('cur-drop');
let curX = -100, curY = -100;

/* move cursor exactly with mouse — tip of nib is at (11, 42) inside the SVG
   so offset so tip = pointer position */
document.addEventListener('mousemove', e => {
  curX = e.clientX; curY = e.clientY;
  cur.style.transform = `translate(${curX - 11}px,${curY - 42}px)`;
}, { passive: true });

/* drip animation on hover */
let dropAnim = null;
function startDrip() {
  if (dropAnim) return;
  let cy = 44, r = 0, growing = true, frame = 0;
  dropAnim = setInterval(() => {
    frame++;
    if (growing) {
      r = Math.min(r + 0.25, 3.2);
      cy += 0.6;
      if (r >= 3.2) growing = false;
    } else {
      r  = Math.max(r - 0.15, 0);
      cy += 1.8;
    }
    curDrop.setAttribute('r',  r);
    curDrop.setAttribute('cy', cy);
    curDrop.setAttribute('opacity', Math.min(r / 3.2, 1));
    if (r <= 0 && !growing) {
      cy = 44; r = 0; growing = true; /* loop */
    }
  }, 16);
}
function stopDrip() {
  clearInterval(dropAnim); dropAnim = null;
  curDrop.setAttribute('r', 0);
}

/* splat on click */
function spawnSplat(x, y) {
  const el = document.createElement('div');
  el.className = 'splat';
  const sz = 26 + Math.random() * 22;
  /* random blob polygon */
  const pts = Array.from({length:7}, (_,i) => {
    const a = (i / 7) * Math.PI * 2;
    const rr = 8 + Math.random() * 9;
    return `${12 + Math.cos(a)*rr},${12 + Math.sin(a)*rr}`;
  }).join(' ');
  el.innerHTML = `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24">
    <polygon points="${pts}" fill="#0a0806" opacity="0.7"/>
    <circle cx="${3+Math.random()*5}" cy="${3+Math.random()*5}" r="${0.8+Math.random()*1.8}" fill="#0a0806" opacity="0.45"/>
    <circle cx="${15+Math.random()*7}" cy="${16+Math.random()*5}" r="${0.6+Math.random()*1.4}" fill="#0a0806" opacity="0.38"/>
  </svg>`;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

document.addEventListener('click', e => spawnSplat(e.clientX, e.clientY));

  "https://www.instagram.com/p/DTYF6ELDNQ4/",
  "https://www.instagram.com/p/DTYFzzTjJVs/",
  "https://www.instagram.com/p/DTYFrzdDEQ6/",
  "https://www.instagram.com/p/DTYFa4ZDKDI/",
  "https://www.instagram.com/p/DTYFS3ijI9D/",
  "https://www.instagram.com/p/DTYFASCDIim/",
  "https://www.instagram.com/p/DTYExoojM13/",
  "https://www.instagram.com/p/DTYEnfMjBmR/",
  "https://www.instagram.com/p/DTYEXxJDD_I/",
  "https://www.instagram.com/p/DTYELhpjC95/",
  "https://www.instagram.com/p/DTYD95jjKFA/",
  "https://www.instagram.com/p/DTYDZXVDH2w/"
];

const grid = document.getElementById('ig-grid');
posts.forEach((url, i) => {
  const item = document.createElement('div');
  item.className = 'ig-item';
  item.style.transitionDelay = (i % 5) * 0.1 + 's';

  const pw = document.createElement('div');
  pw.className = 'pw';

  const num = document.createElement('div');
  num.className = 'pnum';
  num.textContent = i + 1;

  const bq = document.createElement('blockquote');
  bq.className = 'instagram-media';
  bq.setAttribute('data-instgrm-captioned','');
  bq.setAttribute('data-instgrm-permalink', url);
  bq.setAttribute('data-instgrm-version','14');
  bq.style.cssText = 'width:100%;max-width:100%;min-width:unset;';

  /* hover → drip */
  pw.addEventListener('mouseenter', startDrip);
  pw.addEventListener('mouseleave', stopDrip);

  /* click → bounce + ripple + splat */
  pw.addEventListener('click', e => {
    pw.classList.remove('clicked');
    void pw.offsetWidth;
    pw.classList.add('clicked');
    pw.addEventListener('animationend', () => pw.classList.remove('clicked'), {once:true});

    const rip = document.createElement('div');
    rip.className = 'ripple';
    const rect = pw.getBoundingClientRect();
    const sz = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;
    pw.appendChild(rip);
    rip.addEventListener('animationend', () => rip.remove());
  });

  pw.appendChild(num);
  pw.appendChild(bq);
  item.appendChild(pw);
  grid.appendChild(item);
});

/* ── SCROLL REVEAL ── */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting){e.target.classList.add('visible');revObs.unobserve(e.target);} });
}, { threshold:0.06, rootMargin:'0px 0px -30px 0px' });
document.querySelectorAll('.ig-item,.sec-label').forEach(el => revObs.observe(el));

/* ── INSTAGRAM LAZY LOAD ── */
let igLoaded = false;
function loadIG() {
  if (igLoaded) return; igLoaded = true;
  const s = document.createElement('script');
  s.async = true; s.src = '//www.instagram.com/embed.js';
  s.onload = () => window.instgrm && window.instgrm.Embeds.process();
  document.body.appendChild(s);
}
const igTrig = new IntersectionObserver(e => {
  if(e[0].isIntersecting){loadIG();igTrig.disconnect();}
},{rootMargin:'400px'});
igTrig.observe(document.querySelector('.gallery-section'));

const igItemObs = new IntersectionObserver(entries => {
  if(entries.some(e=>e.isIntersecting) && window.instgrm) window.instgrm.Embeds.process();
},{rootMargin:'200px'});
document.querySelectorAll('.ig-item').forEach(el=>igItemObs.observe(el));
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Molly — Ink Art</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0a0806;
      --paper: #f5f0e8;
      --paper2: #ede7d9;
      --accent: #1a1410;
      --muted: #6b5f52;
      --splatter: #0a0806;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: var(--ink);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, opacity 0.2s;
      mix-blend-mode: multiply;
    }
    .cursor.expanded { width: 40px; height: 40px; opacity: 0.3; }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }

    .hero-bg-text {
      position: absolute;
      font-family: 'IM Fell English', serif;
      font-size: clamp(8rem, 20vw, 18rem);
      color: transparent;
      -webkit-text-stroke: 1px rgba(10,8,6,0.06);
      letter-spacing: -0.05em;
      user-select: none;
      white-space: nowrap;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: bgDrift 20s ease-in-out infinite alternate;
    }

    @keyframes bgDrift {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-52%, -48%) scale(1.03); }
    }

    .ink-line {
      width: 1px;
      height: 0;
      background: var(--ink);
      margin: 0 auto 3rem;
      animation: lineGrow 1.4s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    @keyframes lineGrow {
      to { height: 80px; }
    }

    .hero-title {
      font-family: 'IM Fell English', serif;
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 0.9;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
    }

    .hero-title em {
      font-style: italic;
      color: var(--muted);
    }

    .hero-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .scroll-hint span {
      width: 1px;
      height: 40px;
      background: var(--muted);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(0.6); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ink splatter SVG divider */
    .splatter-divider {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      opacity: 0.12;
      pointer-events: none;
    }

    /* Gallery section */
    .gallery-section {
      padding: 4rem 2rem 6rem;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 4rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .section-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-label::before {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--ink);
      opacity: 0.2;
    }

    .section-label span {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--ink);
      opacity: 0.2;
    }

    /* Instagram grid */
    .ig-grid {
      columns: 1;
      column-gap: 2rem;
    }

    @media (min-width: 640px) { .ig-grid { columns: 2; } }
    @media (min-width: 1024px) { .ig-grid { columns: 3; } }

    .ig-item {
      break-inside: avoid;
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      position: relative;
    }

    .ig-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .ig-item:nth-child(2) { transition-delay: 0.1s; }
    .ig-item:nth-child(3) { transition-delay: 0.2s; }
    .ig-item:nth-child(4) { transition-delay: 0.15s; }
    .ig-item:nth-child(5) { transition-delay: 0.25s; }
    .ig-item:nth-child(6) { transition-delay: 0.1s; }
    .ig-item:nth-child(7) { transition-delay: 0.2s; }
    .ig-item:nth-child(8) { transition-delay: 0.05s; }
    .ig-item:nth-child(9) { transition-delay: 0.15s; }
    .ig-item:nth-child(10) { transition-delay: 0.3s; }

    .ig-item blockquote {
      border-radius: 2px !important;
      box-shadow: 0 2px 20px rgba(10,8,6,0.08) !important;
    }

    /* Footer */
    footer {
      border-top: 1px solid rgba(10,8,6,0.1);
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .footer-name {
      font-family: 'IM Fell English', serif;
      font-size: 1.8rem;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .footer-ig {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
      text-decoration: none;
    }

    .footer-ig:hover { opacity: 1; }

    /* Ink drop animation on load */
    .ink-drop {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 0;
      background: var(--ink);
      z-index: 9000;
      animation: inkDrop 1s cubic-bezier(0.16,1,0.3,1) 0s forwards;
      pointer-events: none;
    }

    @keyframes inkDrop {
      0%  { height: 0; opacity: 1; }
      70% { height: 100vh; opacity: 1; }
      100%{ height: 100vh; opacity: 0; }
    }

    /* Decorative corner marks */
    .corner-mark {
      position: fixed;
      width: 20px; height: 20px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.15;
    }
    .corner-mark.tl { top: 1.5rem; left: 1.5rem; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
    .corner-mark.tr { top: 1.5rem; right: 1.5rem; border-top: 1px solid var(--ink); border-right: 1px solid var(--ink); }
    .corner-mark.bl { bottom: 1.5rem; left: 1.5rem; border-bottom: 1px solid var(--ink); border-left: 1px solid var(--ink); }
    .corner-mark.br { bottom: 1.5rem; right: 1.5rem; border-bottom: 1px solid var(--ink); border-right: 1px solid var(--ink); }
  </style>
</head>
<body>

  <div class="ink-drop"></div>
  <div class="cursor" id="cursor"></div>

  <div class="corner-mark tl"></div>
  <div class="corner-mark tr"></div>
  <div class="corner-mark bl"></div>
  <div class="corner-mark br"></div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-bg-text">INK</div>
    <div class="ink-line"></div>
    <h1 class="hero-title">Molly's<br><em>Art</em></h1>
    <p class="hero-sub">Ink &amp; Illustration</p>
    <div class="scroll-hint">
      <span></span>
      scroll
    </div>
  </section>

  <!-- Gallery -->
  <section class="gallery-section">
    <div class="section-label">
      <span>Latest Works</span>
    </div>

    <div class="ig-grid">

      <div class="ig-item">

          data-instgrm-version="14" style="width:100%;max-width:100%;min-width:unset;">
        </blockquote>
      </div>

      <div class="ig-item">
        <blockquote class="instagram-media" data-instgrm-captioned
          data-instgrm-permalink="https://www.instagram.com/p/DUJBikeDOJB/"
          data-instgrm-version="14" style="width:100%;max-width:100%;min-width:unset;">
        </blockquote>
      </div>

      <div class="ig-item">
        <blockquote class="instagram-media" data-instgrm-captioned

        </blockquote>
      </div>

      <div class="ig-item">

          data-instgrm-version="14" style="width:100%;max-width:100%;min-width:unset;">
        </blockquote>
      </div>

      <div class="ig-item">
        <blockquote class="instagram-media" data-instgrm-captioned

          data-instgrm-version="14" style="width:100%;max-width:100%;min-width:unset;">
        </blockquote>
      </div>

      <div class="ig-item">
        <blockquote class="instagram-media" data-instgrm-captioned

      </div>

      <div class="ig-item">

      </div>

      <div class="ig-item">
        <blockquote class="instagram-media" data-instgrm-captioned
          data-instgrm-permalink="https://www.instagram.com/p/DTYK-bjjJIL/"

        </blockquote>
      </div>

      <div class="ig-item">
        <blockquote class="instagram-media" data-instgrm-captioned
          data-instgrm-permalink="https://www.instagram.com/p/DTYKr2BDL7p/"
          data-instgrm-version="14" style="width:100%;max-width:100%;min-width:unset;">
        </blockquote>
      </div>

    </div>
  </section>

  <footer>
    <div class="footer-name">Molly</div>
    <a class="footer-ig" href="https://www.instagram.com/" target="_blank">Instagram ↗</a>
  </footer>

  <!-- Instagram embed script -->
  <script async src="//www.instagram.com/embed.js"></script>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('a, blockquote').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('expanded'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('expanded'));
    });

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.ig-item, .section-label').forEach(el => observer.observe(el));
  </script>
</body>
</html>
